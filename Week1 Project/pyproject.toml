[project]
name = "body-composition-dashboard"
version = "1.0.0"
description = "AI-powered body composition analysis dashboard using Streamlit"
requires-python = ">=3.9"
authors = [{name = "Health Coach AI"}]
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.14.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.290",
]
